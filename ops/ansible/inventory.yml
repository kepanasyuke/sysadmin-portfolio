---
# inventory.yml — инвентарь Ansible.
# Подставьте реальные узлы. Пример:
# web1 ansible_host=192.168.1.11 ansible_user=root
all:
  children:
    webservers:
      hosts:
        web1:
          ansible_host: 192.168.1.11
          ansible_user: root
        web2:
          ansible_host: 192.168.1.12
          ansible_user: root
    databases:
      hosts:
        db1:
          ansible_host: 192.168.1.21
          ansible_user: root
  vars:
    ansible_python_interpreter: /usr/bin/python3